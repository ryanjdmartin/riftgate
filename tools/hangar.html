<title>Riftgate Hangar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* One page for the hangar (decided 1 October): the codex, the bench, the content editor, the
   text and the models, each a tab, all reading the files published beside this page so one
   republish refreshes every tab. Ryan's input lives in the artifact's database: edits of the
   entries (collection "edits", the Content tab's and the Bench's), his notes on the briefs
   (collection "designs") and his writing (collection "text": 9 November, every text the player
   reads, one row a text, from hangar/text.json, tools/hangar_text.py), on the Text tab and on
   the Bench's codex and flavour.
   The Bench tab (10 November) is Ryan's working sheet for a machine: the roster by state, and
   one flat sheet a machine for its numbers, its passive, its codex and flavour, its locked
   pieces, its upgrades, its stock, his notes and its brief; and the Briefs list, the briefs that
   are no one machine's and his ideas with no brief (20 November: the Designs tab folded in, every brief
   in docs/briefs/ from hangar/designs.json, tools/hangar_designs.py, read only with his notes).
   It keeps no store of its own: a number, a stock piece or a note is an edit of the entry
   (collection "edits", as the Content tab's), his notes and upgrade ideas under the entry's
   design.bench, and the codex and flavour are the Text tab's rows. The Models tab (3 October:
   the renders and the animation viewer merged) runs hangar/motion.js (tools/hangar_motion.js),
   a port of the game's rig, over the game's own renders. The Names tab retired on 20 November:
   the makers' kinds of names are docs/naming.md, the name check tools/check_name.py. */
:root{
  --ground:#ECE8DF; --paper:#F6F3EC; --sunk:#E2DDD2; --ink:#1F2226; --ink-2:#4B5058; --ink-3:#7C8189; --rule:#CFC9BC; --rule-strong:#B4AD9F;
  --minerva:#4E6A3B; --kestrel:#33639C; --ws:#8A5730; --aphelion:#B3302C; --arsenal:#3E434D; --other:#6E7279;
  --atk:#A8402F; --shd:#2F63A8; --vent:#8A6A12;
  --ok:#3D7A4A; --warn:#A86A12; --bad:#B0352B; --new:#2F63A8; --edited:#A86A12;
  --acc:var(--ink);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#191B1F; --paper:#22252B; --sunk:#1D2025; --ink:#E6E2D8; --ink-2:#B6B1A6; --ink-3:#7F7B73; --rule:#383C44; --rule-strong:#4A505A;
    --minerva:#8DB36F; --kestrel:#7FA9E0; --ws:#D39562; --aphelion:#E8756F; --arsenal:#A9B0BC; --other:#A0A5AD;
    --atk:#E88870; --shd:#7FA9E0; --vent:#E0B44A;
    --ok:#7BC48A; --warn:#E0A44A; --bad:#EE7A6E; --new:#7FA9E0; --edited:#E0A44A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#191B1F; --paper:#22252B; --sunk:#1D2025; --ink:#E6E2D8; --ink-2:#B6B1A6; --ink-3:#7F7B73; --rule:#383C44; --rule-strong:#4A505A;
  --minerva:#8DB36F; --kestrel:#7FA9E0; --ws:#D39562; --aphelion:#E8756F; --arsenal:#A9B0BC; --other:#A0A5AD;
  --atk:#E88870; --shd:#7FA9E0; --vent:#E0B44A;
  --ok:#7BC48A; --warn:#E0A44A; --bad:#EE7A6E; --new:#7FA9E0; --edited:#E0A44A;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.45 var(--body)}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);border-bottom:1px solid var(--rule);padding-block:10px 6px}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font:800 30px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0}
.eyebrow{font:500 11px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.status{font-size:12px;color:var(--ink-3)}
.status.warn{color:var(--bad)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:8px 2px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;border:1px solid var(--rule);background:var(--paper);color:var(--ink-2);padding:6px 11px;border-radius:4px;font:600 15px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:var(--ground)}
nav.tabs button .count{color:var(--edited);margin-left:6px;font-variant-numeric:tabular-nums}
nav.tabs button[aria-selected="true"] .count{color:inherit}
nav.sub{padding-block:4px 6px}
nav.sub button{font-size:13px;padding:5px 9px;letter-spacing:.06em;background:transparent}
nav.sub button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.lede{color:var(--ink-3);font-size:13px;margin:10px 0 0;max-width:70ch}
.help{font-size:13px;color:var(--ink-3);margin:6px 0 0}
.empty{color:var(--ink-3);padding:20px 0}
.tag{display:inline-block;font:600 10px/1.6 var(--display);letter-spacing:.1em;text-transform:uppercase;padding:0 6px;border:1.5px solid currentColor;border-radius:2px;white-space:nowrap;vertical-align:1px}
.tag.edited{color:var(--edited)} .tag.new{color:var(--new)} .tag.del{color:var(--bad)} .tag.applied{color:var(--ok)} .tag.planned{color:var(--ink-3)}
.btn{border:1px solid var(--rule-strong);background:var(--paper);color:var(--ink);padding:7px 12px;border-radius:4px;font:600 14px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--ground)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:8px 14px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;border-radius:3px}
.toast.show{opacity:1}
img{max-width:100%}

/* ---- codex */
nav.anchors{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:8px 0}
nav.anchors::-webkit-scrollbar{display:none}
nav.anchors a{flex:0 0 auto;border:1px solid var(--rule);border-radius:4px;padding:5px 10px;text-decoration:none;color:var(--ink-2);font:600 14px/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
nav.anchors a:hover{border-color:var(--acc);color:var(--ink)}
.chassis{--acc:var(--other);background:var(--paper);border:1px solid var(--rule);border-left:4px solid var(--acc);border-radius:3px;padding:14px;margin-top:14px;scroll-margin-top:150px}
.chassis.minerva{--acc:var(--minerva)} .chassis.kestrel{--acc:var(--kestrel)} .chassis.ws{--acc:var(--ws)} .chassis.aphelion{--acc:var(--aphelion)} .chassis.arsenal{--acc:var(--arsenal)}
.chassis .head{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start}
.chassis .head .thumb{grid-row:1 / span 3;width:96px;height:96px;object-fit:contain;image-rendering:pixelated;background:var(--ground);border-radius:3px;cursor:pointer}
.desig{font:500 12px/1.4 var(--mono);color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin:0}
.chassis h2{font:700 27px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:1px 0 2px;color:var(--acc)}
.chassis h2 .tag{margin-left:8px;vertical-align:4px}
.sub{color:var(--ink-3);font-size:13px;margin:0 0 10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:3px;overflow:hidden;margin-bottom:10px}
.stat{background:var(--sunk);padding:5px 8px;display:flex;flex-direction:column;gap:1px}
.stat .k{font:600 10px/1.3 var(--display);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3)}
.stat .v{font-variant-numeric:tabular-nums;font-weight:600;font-size:15px}
.passive{border:1px dashed var(--rule-strong);border-radius:3px;padding:8px 10px;margin-bottom:10px}
.passive h4{margin:0 0 2px;font:600 16px/1.2 var(--display);text-transform:uppercase;letter-spacing:.04em}
.passive p{margin:0;color:var(--ink-2);font-size:14px;max-width:70ch}
.passive.none h4,.passive.none p{color:var(--ink-3)}
.chassis h3{font:600 13px/1 var(--display);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);margin:12px 0 6px}
.die{display:grid;gap:6px}
.entry{display:grid;grid-template-columns:auto auto 1fr auto;grid-template-areas:"slot kind name maker" "slot kind nums nums" "slot kind kws kws" "pas pas pas pas";gap:1px 10px;align-items:baseline;background:var(--sunk);border:1px solid var(--rule);border-radius:3px;padding:7px 10px;cursor:pointer}
.entry:hover,.entry:focus-visible{border-color:var(--acc)}
.entry.blank,.entry.missing{opacity:.6;cursor:default}
.slot{grid-area:slot;font:600 10px/1.4 var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);min-width:108px}
.pinnote{margin:0 0 6px;font-size:13px;color:var(--atk)}
.order{margin:0 0 6px;font-size:13px;color:var(--ink-2)}
.kind{grid-area:kind;font:600 10px/1.4 var(--mono);letter-spacing:.06em;padding:1px 5px;border:1px solid currentColor;border-radius:2px;color:var(--ink-3)}
.kind.attack{color:var(--atk)} .kind.shield{color:var(--shd)} .kind.vent{color:var(--vent)}
.cname{grid-area:name;font-weight:600}
.nums{grid-area:nums;font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink-2)}
.kws{grid-area:kws;display:flex;gap:5px;flex-wrap:wrap}
.kw{border:1px solid var(--rule-strong);border-radius:999px;padding:0 7px;font:600 10px/1.7 var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);cursor:help}
.kw.shape{border-style:dashed;color:var(--ink-3)}
.cmaker{grid-area:maker;font-size:11px;color:var(--ink-3);text-align:right}
.pas{grid-area:pas;font-size:13px;color:var(--ink-2);border-top:1px dashed var(--rule);margin-top:5px;padding-top:5px}
.tier{font:600 9px/1.6 var(--mono);letter-spacing:.06em;border:1px solid var(--rule-strong);color:var(--ink-3);border-radius:2px;padding:0 4px;margin-left:5px;vertical-align:1px}
.codex{color:var(--ink-2);font-size:14px;margin:10px 0 0;max-width:70ch}
.clash{font-size:13px;color:var(--ink-2);background:var(--sunk);border-radius:3px;padding:6px 8px;margin:0 0 10px}
@media (max-width:520px){.entry{grid-template-columns:auto 1fr;grid-template-areas:"slot kind" "name name" "nums nums" "kws kws" "maker maker" "pas pas"}.cmaker{text-align:left}.chassis .head .thumb{width:72px;height:72px}}

/* ---- filters and sorts: a pressed chip is filled, so on and off differ by weight, not hue */
.filters{display:flex;flex-direction:column;gap:8px;margin:12px 0 0;padding-block:10px;border-block:1px solid var(--rule)}
.frow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.frow input[type="search"]{flex:1 1 220px;min-width:0;padding:7px 10px;border:1px solid var(--rule-strong);border-radius:4px;background:var(--paper);color:var(--ink);font:inherit;font-size:14.5px}
.fsort{display:flex;gap:6px;align-items:center;font:600 11px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.fsort select{padding:6px 8px;font:500 14px/1.2 var(--body);letter-spacing:0;text-transform:none}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.fgroups{display:grid;gap:6px}
.fgroup{display:grid;grid-template-columns:84px 1fr;gap:6px;align-items:start}
.fgroup .glabel{font:600 11px/1.2 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding-top:8px}
.fchips{display:flex;gap:5px;flex-wrap:wrap;min-width:0}
.fchip{display:inline-flex;gap:6px;align-items:baseline;border:1px solid var(--rule-strong);background:transparent;color:var(--ink-2);border-radius:999px;padding:6px 11px;font:600 13px/1.1 var(--display);letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.fchip .n{font:500 11px/1 var(--mono);color:var(--ink-3);font-variant-numeric:tabular-nums}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.fchip[aria-pressed="true"] .n{color:inherit;opacity:.75}
.fchip.zero{opacity:.4}
.fchip.mk{border-left:5px solid var(--mk)}
.fcount{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}
.linkbtn{border:0;background:none;padding:0;font:inherit;color:var(--ink);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.stat.sorted{background:var(--ink);color:var(--ground)}
.stat.sorted .k{color:inherit;opacity:.8}
.sortval{font:500 12px/1.3 var(--mono);color:var(--ink);border:1px solid var(--rule-strong);border-radius:3px;padding:1px 6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.item .end{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:520px){.fgroup{grid-template-columns:1fr;gap:4px}.fgroup .glabel{padding-top:0}}

/* ---- content editor */
.list{border-top:1px solid var(--rule);margin-top:10px}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--rule);cursor:pointer}
.item:hover,.item:focus-visible{background:var(--paper);outline:none}
.item .name{font-weight:600}
.item .id{font-size:12px;color:var(--ink-3);font-family:var(--mono)}
/* ---- foe sprites (4 November): the cut as the game draws it, whole pixels, never smoothed */
.item.foe{grid-template-columns:auto 1fr auto}
.sprite{width:36px;height:48px;display:flex;align-items:flex-end;justify-content:center;background:var(--paper);border:1px solid var(--rule);flex:none}
.sprite img{image-rendering:pixelated;max-width:36px;max-height:48px;display:block}
.sprite.none{align-items:center;font:600 8px/1.2 var(--mono);color:var(--ink-3);text-align:center;letter-spacing:.04em}
.sprite.ph{border-style:dashed}
.spritegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin-top:10px}
.spritegrid .cell{border:1px solid var(--rule);padding:6px 4px;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.spritegrid .cell:hover,.spritegrid .cell:focus-visible{background:var(--paper);outline:none}
.spritegrid .sprite{width:100px;height:148px}
.spritegrid .sprite img{max-width:96px;max-height:144px}
.spritegrid .name{font-weight:600;font-size:12px;line-height:1.2}
.spritegrid .id{font-size:10px;color:var(--ink-3);font-family:var(--mono);line-height:1.3}
.editor h2{font:700 26px/1 var(--display);margin:14px 0 2px;text-transform:uppercase}
.editor .path{font:400 12px/1.4 var(--mono);color:var(--ink-3)}
.fields{display:grid;gap:12px;margin-top:10px}
.field label{display:block;font-size:12px;color:var(--ink-3);margin-bottom:3px;font-family:var(--mono)}
.field label .type{color:var(--rule-strong);margin-left:6px}
.field input[type="text"],.field input[type="number"],.field textarea{width:100%;font:inherit;font-size:14.5px;color:var(--ink);background:var(--paper);border:1px solid var(--rule-strong);border-radius:3px;padding:7px 9px}
.field textarea{min-height:38px;resize:vertical;line-height:1.45}
textarea.json{font-family:var(--mono);font-size:13px;min-height:90px}
.field.invalid textarea,.field.invalid input{border-color:var(--bad)}
.field .err{color:var(--bad);font-size:12px;margin-top:3px}
fieldset{border:1px solid var(--rule-strong);border-radius:3px;padding:10px 12px 12px;margin:0}
legend{font-size:12px;color:var(--ink-3);padding:0 6px;font-family:var(--mono)}
fieldset .fields{margin-top:4px}
.field.check{display:flex;gap:8px;align-items:center}
.field.check input{width:18px;height:18px}
.note{margin-top:14px}
.diff{font-size:13.5px}
.diff .k{color:var(--ink-3);font-family:var(--mono);font-size:12px}
.diff .was{color:var(--bad);text-decoration:line-through;opacity:.8}
.diff .now{color:var(--ok)}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:3px;padding:12px 14px;margin:10px 0}
.card .name{font-weight:600}
.newrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.newrow input{font:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--rule-strong);border-radius:3px;background:var(--paper);color:var(--ink)}

/* ---- ideas with no brief: one row an idea, its state a pill */
.rows{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 12px;background:var(--paper);border:1px solid var(--rule);border-radius:4px;cursor:pointer}
.row.open{border-color:var(--acc)}
.row .name{font:600 20px/1.1 var(--display);letter-spacing:.02em}
.row .name small{font:500 13px/1 var(--body);color:var(--ink-3);letter-spacing:0;margin-left:8px}
.row .concept{grid-column:1 / -1;color:var(--ink-2);font-size:14px}
.pill{border:1px solid var(--rule-strong);background:transparent;color:var(--ink-2);border-radius:999px;padding:2px 10px;font:600 12px/1.5 var(--display);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;align-self:start;white-space:nowrap}
.pill.idea{border-color:var(--ink-3)}
.pill.liked{border-color:var(--ok);color:var(--ok)}
.pill.landed{background:var(--ok);border-color:var(--ok);color:var(--ground)}
.pill.rejected{border-color:var(--rule);color:var(--ink-3);text-decoration:line-through}
.pill.ghost{border-style:dashed;color:var(--ink-3)}
.row.rejected{opacity:.55}
.row.rejected .name{text-decoration:line-through;text-decoration-color:var(--ink-3)}
.side{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}
.divider{display:flex;align-items:center;gap:10px;margin-top:10px;color:var(--ink-3);font:600 12px/1 var(--display);letter-spacing:.1em;text-transform:uppercase}
.divider::before,.divider::after{content:"";flex:1;border-top:1px dashed var(--rule)}
.edit{grid-column:1 / -1;display:none;flex-direction:column;gap:8px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--rule)}
.row.open .edit{display:flex}
.edit textarea,.edit input,.add input{width:100%;padding:8px 10px;border:1px solid var(--rule-strong);border-radius:4px;background:var(--ground);color:var(--ink);font:inherit;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.add{margin-top:16px;padding:12px 14px;border:1px dashed var(--rule-strong);border-radius:4px;display:flex;flex-direction:column;gap:8px}
.add h3{margin:0;font:700 16px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.add .line{display:flex;gap:8px;flex-wrap:wrap}
.add .line input{flex:1 1 160px}
select{padding:8px;border:1px solid var(--rule-strong);border-radius:4px;background:var(--ground);color:var(--ink);font:inherit}

/* ---- the briefs (the Bench's since 20 November): read only, a waiting correction laid over its
   block in the edited colour, a struck one struck through, a note on a dashed edge */
.dsect{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:18px}
.dsect h3{margin:0;font:700 17px/1.1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.roster{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.rcount{font:500 12px/1.4 var(--mono);color:var(--ink-3);font-variant-numeric:tabular-nums}
.slotrow{--acc:var(--mk,var(--other));display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;padding:8px 12px;background:var(--paper);border:1px solid var(--rule);border-left:4px solid var(--acc);border-radius:3px;cursor:pointer;text-align:left;color:var(--ink);font:inherit;width:100%}
.slotrow:hover,.slotrow:focus-visible{border-color:var(--acc)}
.slotrow .name{font:600 19px/1.1 var(--display);letter-spacing:.02em}
.slotrow .sub2{grid-column:1 / -1;font-size:12.5px;color:var(--ink-3)}
.slotrow .end{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.brief .path{font:400 12px/1.4 var(--mono);color:var(--ink-3)}
.dir{margin-top:12px;padding:10px 12px;border:1px solid var(--acc);border-left-width:4px;border-radius:3px;background:var(--paper);display:flex;flex-direction:column;gap:6px;max-width:72ch}
.dir label{font:600 12px/1.2 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.dir .saved{font-size:14px;color:var(--ink);white-space:pre-wrap}
.dir textarea,.dnote textarea,.add textarea{width:100%;padding:8px 10px;border:1px solid var(--rule-strong);border-radius:4px;background:var(--ground);color:var(--ink);font:inherit;font-size:14.5px;line-height:1.45;resize:vertical}
.secnav{display:flex;gap:4px;flex-wrap:wrap;margin-top:12px}
.secnav button{border:1px solid var(--rule);background:transparent;color:var(--ink-2);border-radius:999px;padding:4px 10px;font:600 12px/1.3 var(--display);letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.secnav button:hover{border-color:var(--acc);color:var(--ink)}
.doc{margin-top:6px;display:flex;flex-direction:column;gap:2px;max-width:72ch}
.dh{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap;margin-top:14px;padding-top:8px;border-top:1px solid var(--rule);scroll-margin-top:150px}
.dh h3{margin:0;font:700 19px/1.15 var(--display);text-transform:uppercase;letter-spacing:.03em;text-wrap:balance;min-width:0}
.dh.h3 h3,.dh.h4 h3{font-size:16px;color:var(--ink-2)}
.dh .linkbtn{font-size:13px;color:var(--ink-3)}
.blk{display:block;padding:4px 8px 4px calc(8px + var(--lvl,0) * 1.3em);border:1px solid transparent;border-radius:3px;color:var(--ink-2);font-size:14.5px;line-height:1.5}
.blk .line{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 6px}
.blk .mk{color:var(--ink-3);font-variant-numeric:tabular-nums;min-width:1em}
.blk .txt{display:block;min-width:0;overflow-wrap:anywhere}
.blk.quote .txt{border-left:3px solid var(--rule-strong);padding-left:10px;font-style:italic}
.blk.edited{background:var(--paper);border-color:var(--edited)}
.blk.struck .txt{text-decoration:line-through;color:var(--ink-3)}
.who{display:inline-block;font:600 10px/1.6 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--edited);margin-right:6px}
.was{margin-top:4px;font-size:13px;color:var(--ink-3)}
.was summary{font-size:12px}
.was .old{margin:4px 0 0;white-space:pre-wrap}
.tbl{overflow-x:auto;max-width:100%}
.tbl table{border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{border:1px solid var(--rule);padding:4px 6px;text-align:left;vertical-align:top}
.tbl th{background:var(--sunk);font-weight:600;color:var(--ink)}
.blk pre{margin:0;overflow-x:auto;font:400 12.5px/1.45 var(--mono);background:var(--sunk);padding:6px 8px;border-radius:3px}
.blk code{font:400 .9em var(--mono);background:var(--sunk);padding:0 3px;border-radius:2px}
.dnote{margin:4px 0 4px calc(8px + var(--lvl,0) * 1.3em);padding:8px 10px;border:1px dashed var(--edited);border-radius:3px;background:var(--paper);font-size:14px;color:var(--ink);display:flex;flex-direction:column;gap:6px}
.dnote .body{white-space:pre-wrap;overflow-wrap:anywhere}
.dnote .meta{font-size:12px;color:var(--ink-3)}
.dnote .old{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink-3);text-decoration:line-through;font-size:13px}
.ideas .row .concept{white-space:pre-wrap}
.stale{margin-top:16px}
.add textarea{min-height:60px}
@media (max-width:520px){.slotrow .end{justify-content:flex-start}.slotrow{grid-template-columns:1fr}}

/* ---- bench (10 November): the roster by state, and one flat sheet a machine. Every control
   is a plain field that saves as it is left; a changed number shows what the files hold. */
.bgroup{margin-top:18px}
.bgroup h3{margin:0 0 4px;font:700 17px/1.1 var(--display);letter-spacing:.06em;text-transform:uppercase;display:flex;gap:8px;align-items:baseline}
.bgroup h3 .n{font:500 12px/1 var(--mono);color:var(--ink-3)}
.bgroup .what{font-size:12.5px;color:var(--ink-3);margin:0 0 6px}
.brow{--mk:var(--other);display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline;width:100%;text-align:left;background:var(--paper);border:1px solid var(--rule);border-left:5px solid var(--mk);border-radius:3px;padding:8px 10px;margin-top:5px;color:var(--ink);font:inherit;cursor:pointer}
.brow:hover,.brow:focus-visible{border-color:var(--mk)}
.brow .bname{font-weight:600}
.brow .bmeta{font-size:12px;color:var(--ink-3);text-align:right;white-space:nowrap}
.brow .bline{grid-column:1 / -1;font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow.minerva,.bsheet.minerva{--mk:var(--minerva)} .brow.kestrel,.bsheet.kestrel{--mk:var(--kestrel)} .brow.ws,.bsheet.ws{--mk:var(--ws)} .brow.aphelion,.bsheet.aphelion{--mk:var(--aphelion)} .brow.arsenal,.bsheet.arsenal{--mk:var(--arsenal)}
.bsheet{--mk:var(--other);--acc:var(--mk)}
.bsheet .bhead{border-left:5px solid var(--mk);padding:2px 0 2px 12px;margin-top:6px}
.bsheet .bhead h2{font:700 30px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:1px 0 2px;color:var(--mk)}
.bsheet>h3{font:600 13px/1 var(--display);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);margin:20px 0 6px;padding-top:10px;border-top:1px solid var(--rule);scroll-margin-top:150px}
.bsheet .hint{font-size:12.5px;color:var(--ink-3);margin:0 0 8px;max-width:72ch}
.bsheet input[type="number"],.bsheet input[type="text"],.bsheet select,.bsheet textarea{width:100%;min-width:0;padding:7px 9px;border:1px solid var(--rule-strong);border-radius:4px;background:var(--paper);color:var(--ink);font:inherit;font-size:15px}
.bsheet textarea{line-height:1.4;resize:vertical;min-height:38px}
.bsheet input:disabled,.bsheet select:disabled,.bsheet textarea:disabled{opacity:.7}
.bsheet label,.bsheet .lab{display:block;font:600 11px/1.3 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:0 0 3px}
.bsheet .changed{border-color:var(--edited);box-shadow:inset 3px 0 0 var(--edited)}
.bsheet .bwas{font:500 11px/1.3 var(--mono);color:var(--edited);margin-top:2px;min-height:14px}
.bnums{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.bpiece{background:var(--paper);border:1px solid var(--rule);border-radius:3px;padding:10px 12px;margin-top:8px}
.bpiece .pname{font-weight:600}
.bpiece .pline{font-size:13px;color:var(--ink-2);margin:1px 0 6px;font-variant-numeric:tabular-nums}
.bpiece .kws{margin:0 0 8px}
.bpiece .prow{display:grid;grid-template-columns:minmax(120px,1fr) 2fr;gap:8px;margin-top:8px}
.bladder{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bdir{background:var(--paper);border:1px solid var(--rule);border-top:4px solid var(--mk);border-radius:3px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.bdir .dname{font:700 15px/1 var(--display);letter-spacing:.08em;text-transform:uppercase}
.bdir .deep{padding-left:10px;border-left:2px dashed var(--rule-strong)}
.blift{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.bstock{display:grid;gap:6px}
.bstock .srow{display:grid;grid-template-columns:118px 1fr;gap:8px;align-items:center}
.bstock .shp{margin:0}
.bstock .swarn{grid-column:2;font-size:12px;color:var(--warn)}
.bsheet .saved{font-size:14px;color:var(--ink);white-space:pre-wrap;margin:0}
.bdir.built{border-top-style:dashed;background:transparent}
.bdir .step{font-size:14px;color:var(--ink-2);margin:0}
.bdir .step b{font:600 12px/1 var(--mono);color:var(--ink-3);margin-right:6px}
.btext{margin-top:12px}
.btext .thead{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:3px}
.btext .thead label{margin:0}
.btext .thead .linkbtn{margin-left:auto;font-size:13px}
.btext .bfiles{margin-top:4px;font-size:13px;color:var(--ink-3)}
.btext .bfiles .old{margin:4px 0 0;white-space:pre-wrap}
.bsheet textarea.quote{font-style:italic}
.bsheet details.bbrief>summary{font:600 15px/1.35 var(--display);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
@media (max-width:560px){.bladder,.blift{grid-template-columns:1fr}.bpiece .prow{grid-template-columns:1fr}.bstock .srow{grid-template-columns:1fr;gap:2px}.bstock .swarn{grid-column:1}}

/* ---- models */
section.model{background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:12px 14px;margin-top:12px;scroll-margin-top:150px}
section.model h2{font:700 22px/1 var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0}
section.model .plate2{color:var(--ink-3);font-size:13px;margin:2px 0 4px}
.when{font:600 11px/1.5 var(--display);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);margin:0}
.mnote{color:var(--ink-2);font-size:14px;margin:2px 0 8px;max-width:66ch}
.pics{display:flex;gap:10px;flex-wrap:wrap}
.pics img{width:min(100%,420px);max-width:100%;height:auto;image-rendering:pixelated;background:var(--ground);border-radius:3px}
.pics.small img{width:min(100%,240px)}
details{margin-top:8px} summary{cursor:pointer;color:var(--ink-3);font-size:13px}

/* ---- models: the live stage keeps its canvas across redraws, the game's renders under it;
   the machine wears its maker's rule */
.mpick{display:flex;gap:4px;flex-wrap:wrap;margin-top:12px}
.mpick button{border:1px solid var(--rule);border-left:4px solid var(--mk);background:var(--paper);color:var(--ink-2);padding:6px 10px;border-radius:3px;font:600 14px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.mpick button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);border-left-color:var(--mk);color:var(--ground)}
.motion{--acc:var(--other);display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:12px;margin-top:12px;align-items:start}
.motion.minerva{--acc:var(--minerva)} .motion.kestrel{--acc:var(--kestrel)} .motion.ws{--acc:var(--ws)} .motion.aphelion{--acc:var(--aphelion)} .motion.arsenal{--acc:var(--arsenal)}
.stage{position:relative;aspect-ratio:4 / 3;max-width:100%;max-height:68vh;background:var(--sunk);border:1px solid var(--rule);border-top:4px solid var(--acc);border-radius:3px;overflow:hidden;touch-action:none}
.stage canvas{display:block;width:100%;height:100%}
.stage-note{position:absolute;inset:auto 10px 8px 10px;font:500 12px/1.4 var(--mono);color:var(--ink-3);pointer-events:none}
.mpanel{display:flex;flex-direction:column;gap:12px;min-width:0}
.mpanel h2{font:700 26px/1 var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0;color:var(--acc)}
.mpanel .plate2{color:var(--ink-3);font-size:13px;margin:2px 0 0}
.mgroup{display:flex;flex-direction:column;gap:6px}
.mgroup .glabel{font:600 11px/1.2 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg .btn{padding:6px 10px}
.acts{display:flex;gap:5px;flex-wrap:wrap}
.scrub{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.scrub input{width:100%;accent-color:var(--acc)}
.scrub output{font:500 12px/1 var(--mono);color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.mfacts{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0;font-size:13px}
.mfacts dt{font:600 11px/1.6 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.mfacts dd{margin:0;color:var(--ink-2);font-variant-numeric:tabular-nums}
.mhelp{font-size:13px;color:var(--ink-3);margin:0;max-width:60ch}
.mpick button.classes{border-left-style:dashed;border-left-color:var(--ink-3)}
.mounts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 8px;align-items:center}
.mounts label{font:600 11px/1.2 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.mounts select{min-width:0;width:100%;padding:5px 6px;font:500 13px/1.2 var(--body)}
.mounts .fitted{color:var(--acc);font-weight:600}
.makers{display:flex;gap:4px;flex-wrap:wrap}
.makers .btn{border-left:4px solid var(--mk)}
.under{margin-top:14px}
/* The Text tab (9 November): every text the player reads, one row a text, by kind. */
.tkind{background:var(--paper);border:1px solid var(--rule);border-radius:3px;padding:10px 14px;margin:10px 0}
.tkind .khead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.tkind h3{margin:0;font:700 18px/1.1 var(--display);letter-spacing:.05em;text-transform:uppercase}
.tkind h3 button{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.tkind h3 button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tkind .where{font-size:13px;color:var(--ink-2);margin:4px 0 8px;max-width:76ch}
.tkind .where.none{color:var(--ink-3);font-style:italic}
.tbar{display:flex;height:10px;border:1px solid var(--rule-strong);border-radius:2px;overflow:hidden;margin:0 0 8px;background:var(--sunk)}
.tbar .yours{background:var(--ink)}
.tbar .passed{background:repeating-linear-gradient(45deg,var(--ink-2) 0 3px,transparent 3px 6px)}
.tbar .flag{background:repeating-linear-gradient(90deg,var(--bad) 0 2px,transparent 2px 4px)}
.tcounts{display:flex;gap:5px;flex-wrap:wrap}
.tcount{display:inline-flex;gap:6px;align-items:baseline;border:1px solid var(--rule-strong);background:transparent;color:var(--ink-2);border-radius:3px;padding:4px 8px;font:600 12px/1.1 var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.tcount .n{font:500 12px/1 var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.tcount.zero{opacity:.4}
.tcount.off{border-style:dashed}
.ttotal{font-size:14.5px;margin:12px 0 0;max-width:76ch}
.ttotal b{font-variant-numeric:tabular-nums}
.tgroup{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:20px;padding-left:8px;border-left:5px solid var(--mk,var(--rule-strong))}
.tgroup h3{margin:0;font:700 17px/1.1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.tvoice{font-size:13px;color:var(--ink-2);margin:3px 0 0 13px;max-width:76ch}
.tvoice b{font:600 11px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-right:6px}
.trows{border-top:1px solid var(--rule);margin-top:8px}
.trow{border-bottom:1px solid var(--rule);border-left:3px solid transparent;padding:8px 6px 8px 9px}
.trow.st-yours{border-left-color:var(--ink)}
.trow.st-passed{border-left-color:var(--rule-strong)}
.trow.st-moved,.trow.st-stale{border-left:3px double var(--bad)}
.trow.open{background:var(--paper);outline:1px solid var(--acc);outline-offset:-1px}
.trow .thead{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.trow .tname{font-weight:600}
.trow .tsub{color:var(--ink-2);font-size:13.5px}
.trow .tkindname{font:500 11px/1.4 var(--mono);color:var(--ink-3)}
.trow .ttags{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.trow .tacts{margin-left:auto;display:flex;gap:4px;align-items:center}
.tmini{border:1px solid var(--rule-strong);background:transparent;color:var(--ink-2);border-radius:3px;padding:4px 7px;font:600 11px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.tmini:hover{background:var(--sunk);color:var(--ink)}
.tmini[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.ttext{margin-top:3px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px;line-height:1.5;color:var(--ink);border-radius:3px;padding:2px 4px;margin-left:-4px;cursor:text}
.ttext:hover,.ttext:focus-visible{background:var(--paper);outline:none;box-shadow:0 0 0 1px var(--rule-strong)}
.trow.open .ttext:hover{box-shadow:none}
.ttext.none{color:var(--ink-3);font-style:italic}
.ttext.quote{font-style:italic}
.trow.unshown .ttext{color:var(--ink-2)}
.tag.yours{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.tag.passed{color:var(--ink)}
.tag.draft{color:var(--ink-3);border-style:dashed}
.tag.empty{color:var(--ink-3);border-style:dotted}
.tag.moved,.tag.stale,.tag.flagged{color:var(--bad)}
.tag.pending{color:var(--edited)}
.tag.unshown{color:var(--ink-3);border-style:dashed;border-width:1px}
.tedit{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.tedit textarea{width:100%;min-height:74px;padding:8px 10px;border:1px solid var(--rule-strong);border-radius:4px;background:var(--ground);color:var(--ink);font:inherit;font-size:15px;line-height:1.5;resize:vertical}
.tedit input[type="text"]{width:100%;padding:7px 10px;border:1px solid var(--rule-strong);border-radius:4px;background:var(--ground);color:var(--ink);font:inherit;font-size:14px}
.tfacts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 10px;font-size:13px;color:var(--ink-2);margin:0}
.tfacts dt{font:600 11px/1.7 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.tfacts dd{margin:0;overflow-wrap:anywhere}
.tfacts dd.mono{font:400 12.5px/1.5 var(--mono)}
.tmeter{font:500 12px/1.4 var(--mono);color:var(--ink-3)}
.tbeside{border-left:3px solid var(--rule-strong);padding:2px 0 2px 10px;display:grid;gap:6px}
.tbeside .lab{font:600 11px/1.4 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.tbeside .ex{font-size:13.5px;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere}
.tbeside .ex b{color:var(--ink);font-weight:600}
.tflagline{font-size:13px;color:var(--bad)}
.tthen{font-size:13.5px;color:var(--ink-2);background:var(--sunk);border-radius:3px;padding:6px 8px;white-space:pre-wrap;overflow-wrap:anywhere}
.tthen .lab{display:block;font:600 11px/1.4 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.tpins{margin:12px 0 0;border:1px solid var(--rule-strong);border-radius:3px;padding:6px 10px;background:var(--paper)}
.tpins summary{font:600 12px/1.6 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);cursor:pointer}
.tpin{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start;padding:6px 0;border-top:1px solid var(--rule);font-size:13.5px}
.tpin .ex{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink-2)}
.tpin .ex b{color:var(--ink);font-weight:600}
.thow{font-size:13.5px;color:var(--ink-2);max-width:76ch;margin:10px 0 0}
.thow li{margin:3px 0}
/* ---- formations (21 November): each domain's packs by tier, folded to a line a pack; opened, its
   grid as the fight stands it and every unit with its moves. A rank is drawn by position, a massive
   foe by spanning both ranks, a scaled number by its tier's mark: structure, never hue alone. */
.fview{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:12px 0 0}
.fview .help{margin:0}
.fdomain{margin-top:22px}
.fdomain>h3{margin:0;font:700 23px/1.1 var(--display);letter-spacing:.04em;text-transform:uppercase;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.fdomain>h3 .n{font:500 12px/1 var(--mono);color:var(--ink-3);letter-spacing:0;text-transform:none}
.fdomain .dsub{font-size:13px;color:var(--ink-2);margin:3px 0 0;max-width:76ch}
.fdomain .dsub .linkbtn{font-size:13px}
.ftier{margin:16px 0 2px;padding-top:8px;border-top:1px solid var(--rule);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ftier h4{margin:0;font:700 15px/1.1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.ftier .n{font:500 12px/1 var(--mono);color:var(--ink-3)}
.ftier .what{font-size:12.5px;color:var(--ink-3)}
.fcard{background:var(--paper);border:1px solid var(--rule);border-left:4px solid var(--rule-strong);border-radius:3px;margin-top:6px;scroll-margin-top:150px}
.fcard.k-formation{border-left-color:var(--ink)}
.fcard.k-patrol{border-left-style:dashed}

<div class="wrap" id="app">
  <header class="top">
    <div class="brand">
      <div><span class="eyebrow">Riftgate</span><h1>Hangar</h1></div>
      <div class="status" id="status">Loading the shipped files…</div>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
    <nav class="tabs sub" id="subtabs" role="tablist" aria-label="Within the section"></nav>
  </header>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="hangar/motion.js"></script>
<script>
// ------------------------------------------------------------------ shared
// The shipped content is published beside this page at content/<file>.json. Edits are
// documents in the artifact's database (collection "edits", id "<file>.<list>__<entry id>",
// the whole edited entry); his notes on the briefs are collection "designs" (the Bench's briefs
// say how they fold in); his texts, marks and notes on the Text tab and the Bench's codex and
// flavour are collection "text" (the Text tab says how they fold in). A session pulls "edits"
// with ArtifactData and applies them to content/*.json; once the shipped file matches, the
// entry shows as applied and the document can be cleared.
// A chassis is edited on its Bench sheet (20 November: Ryan, "if the bench could also edit codex
// and flavour text, there's no reason the content->chassis tab needs to exist"), so it loads
// here with no tab of the Content's.
const FILES = [
  {key: "chassis.entries", label: "Chassis", file: "content/chassis.json", list: "entries", filter: "chassis", bench: true},
  {key: "chassis.makers", label: "Makers", file: "content/chassis.json", list: "makers", filter: "makers"},
  {key: "components.entries", label: "Components", file: "content/components.json", list: "entries", filter: "components"},
  {key: "modules.entries", label: "Modules", file: "content/modules.json", list: "entries", filter: "modules"},
  {key: "foes.entries", label: "Foes", file: "content/foes.json", list: "entries", filter: "foes"},
  {key: "factions.entries", label: "Factions", file: "content/factions.json", list: "entries", filter: "factions"},
  {key: "vocabulary.entries", label: "Vocabulary", file: "content/vocabulary.json", list: "entries", filter: "vocabulary"},
];
const contentFiles = () => FILES.filter(f => !f.bench);
const SECTIONS = [
  {id: "codex", label: "Codex"},
  {id: "bench", label: "Bench"},
  {id: "content", label: "Content"},
  {id: "text", label: "Text"},
  {id: "models", label: "Models"},
];
// Each maker's colour (the --minerva and the rest) and the short name a chip or a tab wears.
const MAKER_TAB = {minerva: "minerva", kestrel: "kestrel", wainwright_sutler: "ws", aphelion: "aphelion", arsenal: "arsenal"};
const MAKER_SHORT = {minerva: "Minerva", kestrel: "Kestrel", wainwright_sutler: "W&S", aphelion: "Aphelion", arsenal: "Arsenal"};
const KIND_GLYPH = {attack: "ATK", shield: "SHD", vent: "VENT", buff: "BUFF"};
const REACH = {direct: "direct", indirect: "indirect", every_foe: "every foe"};

const state = {
  shipped: {}, about: {}, edits: {},
  section: "codex", sub: {content: "components.entries", text: "overview", bench: "all"},
  open: null, returnTo: null, draft: null, invalid: new Set(), raw: false, fopen: new Set(), fscroll: null,
  db: null, user: null, dbState: "loading", canWrite: true,
  designs: null, dnotes: [], designState: "connecting", dNote: null, dDir: null, dIdea: null, dAdd: null, bbrief: {},
  pins: null, renders: null,
  text: null, tdocs: {}, textState: "connecting", topen: null, tdraft: null, tpins: [], tshown: [], tmore: 0, tkept: {},
  bopen: null, bdraft: {},
  filters: {},
};
try {
  const s = JSON.parse(localStorage.getItem("hangar.tabs") || "{}");
  if (SECTIONS.some(x => x.id === s.section)) state.section = s.section;
  if (s.sub) Object.assign(state.sub, s.sub);
  if (s.v !== 2) delete state.sub.foeView;   // the Foes tab opens on its formations since 21 November, whatever view was kept before
  if (state.sub.content !== "changes" && !contentFiles().some(f => f.key === state.sub.content)) state.sub.content = "components.entries";
} catch (e) {}
try {
  const f = JSON.parse(localStorage.getItem("hangar.filters") || "{}");
  if (f && typeof f === "object" && !Array.isArray(f)) state.filters = f;
} catch (e) {}
// A link to one brief (#br-<its file's name, hyphens for underscores>) opens it on the Bench: a
// machine's on its sheet, any other on the Briefs list.
if (location.hash.startsWith("#br-")) { state.section = "bench"; state.bopen = {kind: "link", id: location.hash.slice(4)}; }
function remember() { try { localStorage.setItem("hangar.tabs", JSON.stringify({v: 2, section: state.section, sub: state.sub})); } catch (e) {} }
function rememberFilters() { try { localStorage.setItem("hangar.filters", JSON.stringify(state.filters)); } catch (e) {} }

const $ = (s, root = document) => root.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "html") n.innerHTML = v;
    else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids) if (kid !== null && kid !== undefined && kid !== false) n.append(kid);
  return n;
};
const docId = (key, id) => `${key}__${id}`;
const safeId = (s) => String(s).replace(/[^A-Za-z0-9_.~:@+-]/g, "-");
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
let toastT = null;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 1800);
}
function setStatus(msg, warn = false) { const s = $("#status"); s.textContent = msg; s.classList.toggle("warn", warn); }
function writeFailed(e) { toast("Write refused: " + (e && e.code ? e.code : "unknown")); if (e && e.code === "invalid_argument") { state.canWrite = false; render(); } }
function setHash(h) { try { const base = location.href.split("#")[0]; history.replaceState(null, "", h ? base + "#" + h : base); } catch (e) {} }
function focusLater(id) { requestAnimationFrame(() => { const n = document.getElementById(id); if (n) { n.focus(); if (n.tagName === "TEXTAREA") autosize(n); } }); }

// Every file the page reads is fetched past every cache: the browser's (no-store) and any
// cache between (a stamp on the URL), so a republish shows at once (28 October: a stale
// rig would play an older round's acts).
const fresh = (path) => path + (path.includes("?") ? "&" : "?") + "v=" + Date.now();
async function fetchJson(path) {
  const r = await fetch(fresh(path), {cache: "no-store"});
  if (!r.ok) throw new Error(`${path}: ${r.status}`);
  return r.json();
}
async function loadShipped() {
  const seen = new Set();
  for (const f of FILES) {
    if (seen.has(f.file)) continue;
    seen.add(f.file);
    const json = await fetchJson(f.file);
    state.about[f.file] = json._about || "";
    for (const g of FILES) if (g.file === f.file) state.shipped[g.key] = json[g.list] || [];
  }
}
// The other files load when a tab first wants them; each is fetched once.
const loaders = {};
state.loaded = {};
function ensure(name, path, apply) {
  if (loaders[name]) return loaders[name];
  loaders[name] = fetchJson(path).then(apply).catch(ex => { toast(`Could not load ${path}`); console.error(ex); }).then(() => { state.loaded[name] = true; });
  return loaders[name];
}
// A tab asks for its file once and re-renders when it lands; after that, never again.
function want(name, loader) { if (!state.loaded[name] && !loaders[name]) loader().then(() => render()); }
const ensurePins = () => ensure("pins", "hangar/pins.json", j => { state.pins = j.pins || {}; });
const ensureRenders = () => ensure("renders", "hangar/renders.json", j => { state.renders = j; });
// The foes' sprites (4 November): hangar/foes.json says which foe has a combat sprite published
// beside the page (hangar/foes/<id>.png) and whether it is a picked render or a rough
// placeholder (tools/placeholder_art.py's), for the Foes list and its Art filter.
const ensureFoeArt = () => ensure("foeart", "hangar/foes.json", j => { state.foeArt = j.art || {}; });
const foeArtState = (id) => (state.foeArt ? (state.foeArt[id] || "none") : "none");
function spriteEl(id, big = false) {
  const st = foeArtState(id);
  if (st === "none") return el("div", {class: "sprite none", title: state.foeArt ? "no sprite in art/foes yet: the views draw the placeholder shape" : "loading"}, state.foeArt ? "no art" : "");
  return el("div", {class: "sprite" + (st === "placeholder" ? " ph" : ""), title: st === "placeholder" ? "a rough placeholder (tools/placeholder_art.py), a reminder until a render is picked" : st === "hero" ? "its hero's sprite: a promoted form wears it until the boss register's is cut" : "a picked render, or a recolour of one"},
    el("img", {src: fresh("hangar/foes/" + id + ".png"), alt: "", loading: "lazy", width: big ? null : "36"}));
}
// A foe's kind (4 November): its flags and where the content lists it, by structure.
function foeKind(e) {
  const c = ctx();
  if (e.hero) return "hero";
  if (e.promotes) return "promoted";
  for (const f of c.factions.values()) if ([].concat(f.boss || []).includes(e.id)) return "boss";
  if (e.wanders) return "wanderer";
  if (e.elite) return "elite";
  for (const o of c.foes.values()) if ((o.parts || []).includes(e.id)) return "part";
  return "rank and file";
}
// The tiers a foe is dealt at (4 November): every composition of its faction that lists it,
// a boss at every tier (drawn at any), a hero its final, else its own tier.
function foeTiers(e) {
  const c = ctx();
  const kind = foeKind(e);
  if (kind === "boss") return ["1", "2", "3"];
  if (kind === "hero" || kind === "promoted") return ["final"];
  const tiers = new Set();
  for (const f of c.factions.values()) for (const comp of (f.compositions || [])) {
    if (![...(comp.front || []), ...(comp.back || [])].includes(e.id)) continue;   // the grid is the declaration (8 November)
    for (const t of [].concat(comp.tiers === undefined ? [1] : comp.tiers)) tiers.add(String(t));
  }
  if (!tiers.size) tiers.add(String(e.tier || 1) + (kind === "part" ? "" : "*"));   // listed nowhere: its own tier, starred (a summon, a split, a part)
  return [...tiers];
}

// ---- edits over the shipped content
function shippedEntry(key, id) { return (state.shipped[key] || []).find(e => e.id === id) || null; }
function editFor(key, id) { return state.edits[docId(key, id)] || null; }
function entryState(key, id) {
  const e = editFor(key, id), s = shippedEntry(key, id);
  if (!e) return "";
  if (e.deleted) return s ? "del" : "applied";
  if (!s) return "new";
  return same(e.data, s) ? "applied" : "edited";
}
function pendingCount(key) {
  return Object.values(state.edits).filter(e => (key ? e.key === key : true) && !["", "applied"].includes(entryState(e.key, e.id))).length;
}
// The content as it will be once the edits land: every tab but the editor's own reads this.
function liveEntries(key) {
  const out = [];
  for (const s of (state.shipped[key] || [])) {
    const st = entryState(key, s.id);
    if (st === "del") continue;
    out.push({entry: st === "edited" ? editFor(key, s.id).data : s, st});
  }
  for (const e of Object.values(state.edits)) if (e.key === key && !e.deleted && !shippedEntry(key, e.id)) out.push({entry: e.data, st: "new"});
  return out;
}
const liveMap = (key) => new Map(liveEntries(key).map(x => [x.entry.id, x]));

// The lookups every tab shares, built once per render from the live content.
let CTX = null;
function ctx() {
  if (CTX) return CTX;
  const byId = (key) => new Map(liveEntries(key).map(x => [x.entry.id, x.entry]));
  const fitted = new Map(), byMaker = new Map(), locked = new Set();
  for (const {entry: e} of liveEntries("chassis.entries")) {
    for (const cid of new Set(dieIds(e))) fitted.set(cid, (fitted.get(cid) || 0) + 1);
    byMaker.set(e.maker, (byMaker.get(e.maker) || 0) + 1);
    for (const cid of (e.fixed || [])) locked.add(cid);
  }
  const foes = byId("foes.entries"), factions = byId("factions.entries");
  const bosses = new Set(), coreOf = new Map();
  for (const f of factions.values()) for (const b of [].concat(f.boss || [])) bosses.add(b);
  for (const f of foes.values()) for (const p of (f.parts || [])) coreOf.set(p, f.id);
  return CTX = {chassis: byId("chassis.entries"), makers: byId("chassis.makers"), comps: liveMap("components.entries"), factions, foes, fitted, byMaker, locked,
    whole: resolveFoes(foes), bosses, coreOf};
}
// A promoted form as the content loads it (ContentDB._resolve_promotions): its hero's entry with its
// own fields over it, the hero's moves first (one of its own with a hero move's id in that move's
// place), `hero` and `design` its own. Every reader of a foe's numbers and moves reads this.
function resolveFoes(foes) {
  const out = new Map(foes);
  for (const [id, e] of foes) {
    const base = e.promotes ? foes.get(e.promotes) : null;
    if (!base || base.promotes) continue;
    const whole = JSON.parse(JSON.stringify(base));
    delete whole.hero; delete whole.design;
    for (const [k, v] of Object.entries(e)) if (k !== "actions") whole[k] = v;
    const own = Array.isArray(e.actions) ? e.actions : [], byId = new Map(own.map(o => [o.id, o])), taken = new Set(), acts = [];
    for (const a of base.actions || []) { if (byId.has(a.id)) { acts.push(byId.get(a.id)); taken.add(a.id); } else acts.push(a); }
    for (const o of own) if (!taken.has(o.id)) acts.push(o);
    whole.actions = acts;
    out.set(id, whole);
  }
  return out;
}
const foeWhole = (id) => ctx().whole.get(id) || null;
const foeName = (id) => { const f = foeWhole(id); return f ? (f.name || plain(id)) + (f.promotes && !(ctx().foes.get(id) || {}).name ? ", promoted" : "") : plain(id); };
// The components on a chassis's die: fixed first, then one per hardpoint.
function dieIds(e) { return [...(e.fixed || []), ...(e.loadout || []).slice(0, Number(e.hardpoints || 0))]; }
function dieComps(e) { return dieIds(e).map(id => ctx().comps.get(id)).filter(Boolean).map(x => x.entry); }
const faceKeywords = (c) => ((c && c.face) || {}).keywords || [];
const kindOf = (c) => ((c && c.face) || {}).kind || "";
// A component's blueprint tier, as ContentDB.component_tier: the tier it stores, 0 the basics
// (a run starts with their blueprints) to 3; null for a locked one, never a blueprint.
const compTier = (c) => (!c || ctx().locked.has(c.id) || c.tier === undefined || c.tier === null) ? null : Number(c.tier);
function makerShort(id) { return MAKER_SHORT[id] || (ctx().makers.get(id) || {}).name || id || ""; }
const factionName = (id) => (ctx().factions.get(id) || {}).name || id || "";
const plain = (s) => String(s ?? "").replace(/_/g, " ");

// ------------------------------------------------------------------ filters and sorts
// One filter per kind of thing, wherever it is listed. Chips within a group are alternatives
// (any of them); groups narrow each other (all of them); the search wants every word typed
// somewhere in the entry's names, ids and keywords. A chip's count is what tapping it would

  const pickC = el("div", {class: "seg"});

  for (const c of [...state.shapes.classes, ...Object.keys(state.shapes.variants || {})]) pickC.append(el("button", {class: "btn", id: "mo-class-" + c, "aria-pressed": String(c === MOTION.shape),
    onclick: () => { MOTION.shape = c; rememberMotion(); render(); }}, plain(c)));
  const pickM = el("div", {class: "makers"});
  for (const m of state.shapes.makers) pickM.append(el("button", {class: "btn", id: "mo-metal-" + m, "aria-pressed": String(m === MOTION.maker), style: `--mk:var(--${MAKER_TAB[m] || "other"})`,
    onclick: () => { MOTION.maker = m; rememberMotion(); render(); }}, makerShort(m)));
  panel.append(el("div", {class: "mgroup"}, el("span", {class: "glabel"}, "Class"), pickC),
    el("div", {class: "mgroup"}, el("span", {class: "glabel"}, "Metal"), pickM),
    el("p", {class: "mhelp"}, "Any machine's mounts take these too: pick a machine and fit a mount. A variant is a class in another form, worn where a mount declares it (a round port takes the round rack)."));
  panel.append(el("div", {class: "seg"}, el("button", {class: "btn primary", id: "mo-play", title: "The class turns while it plays", onclick: () => { st.playing = !st.playing; st.emit(); }}, st.playing ? "Pause" : "Play")));
}

// ------------------------------------------------------------------ the database
function statusLine() {
  const n = pendingCount();
  const parts = [];
  if (state.dbState === "ready") parts.push(n ? `${n} pending edit${n === 1 ? "" : "s"}` : "no pending edits");
  if (state.designState === "on") { const k = openNotes().length; parts.push(k ? `${k} on the briefs` : "nothing on the briefs"); }
  if (state.textState === "on" && state.text) { const k = textPending().length; if (k) parts.push(`${k} text${k === 1 ? "" : "s"} waiting`); }
  setStatus(parts.length ? parts.join(" · ") + " · synced live" : "Shipped files loaded");
}
async function connectDb() {
  const db = window.claude && window.claude.use ? await window.claude.use("db") : null;
  if (!db) { state.dbState = "none"; state.designState = "off"; state.textState = "off"; setStatus("Read only: the database did not load in this view.", true); render(); return; }
  state.db = db;
  try { const user = await window.claude.use("user"); if (user) { const w = await user.can("data.write"); if (w === false) state.canWrite = false; } } catch (e) {}
  db.collection("edits").onSnapshot((snap) => {
    state.edits = {};
    for (const d of snap.docs) { const data = d.data(); if (data && data.key) state.edits[d.id] = data; }
    state.dbState = "ready";
    statusLine();
    if (!state.open || !state.raw) render(); else renderTabs();   // a sheet redraws with its fields; the raw editor keeps its draft
  }, (err) => { state.dbState = "none"; setStatus("Edits cannot sync: " + err.code, true); render(); });
  db.collection("designs").onSnapshot((snap) => {
    state.dnotes = snap.docs.map(s => ({id: s.id, ...s.data()})).filter(n => n && n.type);
    state.designState = "on";
    statusLine();
    if (state.section === "bench") render(); else renderTabs();
  }, (err) => { state.designState = "off"; render(); });
  // The texts show on the Text tab and on a Bench sheet's codex and flavour.
  db.collection("text").onSnapshot((snap) => {
    state.tdocs = {};
    for (const d of snap.docs) { const data = d.data(); if (data && data.slot) state.tdocs[d.id] = data; }
    state.textState = "on";
    statusLine();
    if (state.section === "text" || state.section === "bench" || (state.section === "content" && state.open && !state.raw)) render(); else renderTabs();
  }, (err) => { state.textState = "off"; render(); });
}

(async () => {
  try {
    await loadShipped();
    setStatus("Shipped files loaded · connecting…");
    render();
  } catch (ex) {
    setStatus("Could not load the shipped content: " + ex.message, true);
    return;
  }
  connectDb();
})();
window.addEventListener("hashchange", () => {
  if (!location.hash.startsWith("#br-")) return;
  state.section = "bench"; state.open = null; state.topen = null; state.dNote = null; state.dDir = null; state.dIdea = null;
  state.bopen = {kind: "link", id: location.hash.slice(4)};
  remember(); render(); window.scrollTo(0, 0);
});
$("#tabs").addEventListener("keydown", e => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const ids = SECTIONS.map(s => s.id); const i = ids.indexOf(state.section) + (e.key === "ArrowRight" ? 1 : -1);
  setSection(ids[(i + ids.length) % ids.length]);
});
</script>
