<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Patrick Hand', 'Segoe Print', 'Comic Sans MS', cursive; color: #222222; }
    a { color: #b45309; } a:hover { color: #92400e; }
  </style>
</helmet>
<div style="width: 360px; height: 420px; box-sizing: border-box; background: #fbfaf7; border: 2px dashed #888888; padding: 12px; display: flex; flex-wrap: wrap; gap: 14px; align-content: flex-start;">

  <div style="width: 60px; height: 62px; border: 1.5px dashed #333333; border-radius: 6px; background: #cfd6dc; display: flex; align-items: flex-end; justify-content: center; font-size: 12px; color: #333333;">mech</div>

  <div style="width: 52px; height: 62px; border: 1.5px dashed #444444; border-radius: 6px; background: #ddd8cf; display: flex; align-items: flex-end; justify-content: center; font-size: 12px; color: #444444;">foe</div>

  <div style="width: 90px; height: 90px; border: 1.5px dashed #444444; border-radius: 8px; background: #d9d2c8; display: flex; align-items: flex-end; justify-content: center; font-size: 12px; color: #444444;">elite / boss</div>

  <div style="width: 62px; height: 62px; border: 1.5px solid #222222; border-radius: 12px; background: #ffffff; position: relative; display: flex; align-items: center; justify-content: center; font-size: 30px;"><svg style="position: absolute; left: 5px; top: 5px;" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#222222" stroke-width="1.5"><circle cx="7" cy="7" r="4"></circle><path d="M7 0 V3 M7 11 V14 M0 7 H3 M11 7 H14"></path></svg>30</div>

  <div style="width: 32px; border: 1px solid #222222; background: #ffffff; padding: 1px; display: flex; flex-direction: column; gap: 1px; align-self: flex-start;"><div style="height: 4px; background: #d8d2c4; width: 90%;"></div><div style="height: 4px; background: #5aa9e6; width: 60%;"></div><div style="height: 4px; background: #f0663a; width: 20%;"></div></div>

  <div style="width: 30px; height: 8px; border: 1px solid #222222; background: #ffffff; align-self: flex-start;"><div style="width: 70%; height: 100%; background: #8a3a3a;"></div></div>

  <div style="display: flex; align-items: center; gap: 2px; border: 1px solid #222222; border-radius: 8px; background: #ffffff; padding: 0 5px; font-size: 11px; line-height: 14px; align-self: flex-start;"><svg width="9" height="9" viewBox="0 0 10 10" stroke="#222222" stroke-width="1.5" fill="none"><path d="M1 9 L9 1 M6 1 L9 1 L9 4"></path></svg>2</div>

  <div style="width: 110px; height: 34px; border: 1.5px solid #222222; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 15px; background: #ffffff;">button</div>

  <div style="width: 30px; height: 22px; border: 1.5px solid #222222; border-radius: 11px; display: flex; align-items: center; justify-content: center; background: #ffffff;"><svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#222222" stroke-width="1.5"><path d="M1 6 C4 1 12 1 15 6 C12 11 4 11 1 6 Z"></path><circle cx="8" cy="6" r="2"></circle></svg></div>

  <div style="width: 150px; height: 60px; border: 1.5px solid #222222; border-radius: 8px; background: #ffffff; padding: 6px; font-size: 12px; line-height: 1.3; color: #333333;">details popup<br>hull 120/140 · shield 30/40<br>Hot Hands: ×2 dmg, ×2 heat</div>

  <div style="width: 80px; height: 4px; background: #b33a1a; align-self: center; position: relative;"><div style="position: absolute; right: -2px; top: -4px; width: 0; height: 0; border-left: 8px solid #b33a1a; border-top: 6px solid transparent; border-bottom: 6px solid transparent;"></div></div>

  <div style="font-size: 14px; color: #555555; align-self: center;">label text</div>

  <div style="width: 100%; font-size: 12px; color: #999999; margin-top: 6px;">copy any piece, paste it on the sketch board, drag it where you want it.</div>
</div>
</x-dc>
</body>
</html>
